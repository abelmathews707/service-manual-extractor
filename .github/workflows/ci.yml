name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # The suite synthesises its own archives, so it needs no Ford content
    # and runs anywhere.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.9', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Check the CLI starts
        run: |
          python -m fsd --version
          python -m fsd --help
          python -m sme --version
          python -m sme --help

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install ruff
      - run: ruff check .

  pdf-and-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: pip install jsonschema
      - run: python -m unittest discover -s tests -v

  no-content:
    # A standing guard: this repository must never gain manufacturer manual content.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if manual media was committed
        run: |
          found=$(git ls-files | grep -Ei '\.(arc|epl|pdf|zip|iso|img|enc|cab|hdr|inx)$' || true)
          if [ -n "$found" ]; then
            echo "::error::Manufacturer manual content must not be committed:"
            echo "$found"
            exit 1
          fi
          big=$(git ls-files -z | xargs -0 -I{} find {} -size +2M 2>/dev/null || true)
          if [ -n "$big" ]; then
            echo "::error::Unexpectedly large files committed:"
            echo "$big"
            exit 1
          fi
          echo "Clean: no manufacturer manual content in the repository."
