name: CI

on:
  push:
    branches: [main, codex/procedure-structure-b3]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # The suite synthesises its own archives, so it needs no Ford content
    # and runs anywhere.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.9', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Check the CLI starts
        run: |
          python -m fsd --version
          python -m fsd --help
          python -m sme --version
          python -m sme --help

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install ruff
      - run: ruff check .

  pdf-and-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: pip install jsonschema
      - run: python -m unittest discover -s tests -v

  full-optional-gate:
    # Required before a release: unlike the portability matrix, this job
    # installs every optional tool and fails if any test is skipped.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: abelmathews707/workshop-manual-toolkit
          ref: d150e7d889eb55ebba85065da264ab2bc414755d
          path: toolkit
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install PDF, OCR, schema and browser tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils tesseract-ocr ocrmypdf
          python -m pip install -r acceptance/requirements-a10.txt
          npm install --prefix "$RUNNER_TEMP/browser" playwright
          "$RUNNER_TEMP/browser/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/browser/node_modules" >> "$GITHUB_ENV"
          CHROME_PATH=$(NODE_PATH="$RUNNER_TEMP/browser/node_modules" node -p "require('playwright').chromium.executablePath()")
          echo "REPAIR_BUDDY_TEST_CHROME=$CHROME_PATH" >> "$GITHUB_ENV"
          echo "TOOLKIT_ROOT=$GITHUB_WORKSPACE/toolkit" >> "$GITHUB_ENV"
          echo "RUN_REAL_OCR=1" >> "$GITHUB_ENV"
      - name: Run all extractor tests with no skips
        run: python scripts/run_ci_suite.py

  no-content:
    # A standing guard: this repository must never gain manufacturer manual content.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if manual media was committed
        run: |
          found=$(git ls-files | grep -Ei '\.(arc|epl|pdf|zip|iso|img|enc|cab|hdr|inx)$' || true)
          if [ -n "$found" ]; then
            echo "::error::Manufacturer manual content must not be committed:"
            echo "$found"
            exit 1
          fi
          big=$(git ls-files -z | xargs -0 -I{} find {} -size +2M 2>/dev/null || true)
          if [ -n "$big" ]; then
            echo "::error::Unexpectedly large files committed:"
            echo "$big"
            exit 1
          fi
          echo "Clean: no manufacturer manual content in the repository."
